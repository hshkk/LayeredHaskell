name: Haskell CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: haskell-actions/setup@v2
      id: setup
      with:
        ghc-version: '9.6.7'
        cabal-version: '3.10'

    - name: Cache
      uses: actions/cache@v4
      env:
        cache-name: cache-cabal
      with:
        path: |
          ~/.cabal/packages
          ~/.cabal/store
          dist-newstyle
        key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-${{ env.cache-name }}-${{ hashFiles('**/*.cabal', '**/cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-${{ env.cache-name }}-

    - name: Install dependencies
      run: |
        cabal update
        cabal build --only-dependencies --enable-tests --enable-benchmarks all
    - name: Build
      run: cabal build --enable-tests --enable-benchmarks all
    - name: Run tests
      run: cabal test all
    
    - name: Build documentation
      if: github.event_name == 'push'
      run: |
        rm -rf dist-newstyle/build/*/ghc-*/*/doc
        cabal haddock all --haddock-hyperlink-source --haddock-quickjump
        mkdir _site
        DOCDIR=$(dirname "$(find dist-newstyle -path '*/doc/html/*/index.html' | head -n 1)")
        cp -r "$DOCDIR"/. _site/

    - name: Upload documentation
      if: github.event_name == 'push'
      uses: actions/upload-pages-artifact@v5
      with:
        path: _site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
