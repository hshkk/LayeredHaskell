name: Publish

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.6.7'
        cabal-version: '3.12.1.0'

    - name: Build layers
      shell: bash
      run: |
        cabal update
        runghc scripts/Build.hs

    - name: Create archives
      shell: bash
      run: |
        mkdir -p dist/archive
        cd dist
        for folder in LayeredHaskell-*; do
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "archive/$folder.zip" "$folder"
          else
            tar -czf "archive/$folder.tar.gz" "$folder"
          fi
        done

    - name: Attach to release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "${{ github.event.release.tag_name }}" dist/archive/*